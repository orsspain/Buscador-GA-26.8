<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#af101a" />
      <stop offset="100%" stop-color="#80000a" />
    </linearGradient>
  </defs>
  <!-- Background Circle/Rounded Square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- GA Emblem Inner Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.9" />
  <circle cx="256" cy="256" r="196" fill="#0b1c30" stroke="#d5e0f8" stroke-width="4" />
  
  <!-- GA Big Monogram Letters -->
  <g transform="translate(256, 250) scale(3.2)" text-anchor="middle" dominant-baseline="central">
    <!-- G -->
    <path d="M-40 -45 L-12 -45 L-12 -28 L-30 -28 L-30 25 L-5 25 L-5 2 L-18 2 L-18 -12 L10 -12 L10 42 L-48 42 L-48 -35 Z" fill="#af101a" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <!-- A -->
    <path d="M-8 -45 L22 -45 L48 42 L25 42 L18 18 L-8 18 L-8 2 L13 2 L2 -30 L-8 -30 Z" fill="#af101a" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <!-- White triangle inside A -->
    <polygon points="1.5,-18 11.5,-18 6.5,-3 1.5,-3" fill="#ffffff" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Subtitle -->
  <text x="256" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">JUGADORES ANÓNIMOS</text>
</svg>
